name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: true
  # 按雅加达时间设置：前两项依次是分钟、小时。
  schedule:
    - cron: "25 22 * * *"
      timezone: "Asia/Jakarta"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || vars.SEND_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_STORAGE_STATE: ${{ secrets.DOUYIN_STORAGE_STATE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      HEADLESS: "true"
      TRACE: "false"
      SEND_ENABLED: ${{ vars.SEND_ENABLED }}
      EVENT_NAME: ${{ github.event_name }}
      REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        run: python -c 'import os,pathlib; pathlib.Path("config.json").write_text(os.environ["DOUYIN_CONFIG"], encoding="utf-8")'
      - name: Restore sending history
        uses: actions/cache/restore@v4
        with:
          path: artifacts/history.json
          key: douyin-history-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: douyin-history-v2-${{ github.ref_name }}-
      - name: Run
        run: python scripts/personal_cloud_run.py
      - name: Save sending history even after a failed send
        if: always() && hashFiles('artifacts/history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: artifacts/history.json
          key: douyin-history-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
